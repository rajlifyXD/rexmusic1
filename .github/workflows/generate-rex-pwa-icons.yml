name: Generate REX PWA icons

on:
  push:
    branches:
      - feat/rex-pwa-icon-refresh
    paths:
      - .github/pwa-icon-source.ready

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out icon refresh branch
        uses: actions/checkout@v4
        with:
          ref: feat/rex-pwa-icon-refresh
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate all REX launcher sizes
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import base64
          import hashlib
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          source_file = Path(".github/pwa-icon-source.jpg.b64")
          encoded = "".join(source_file.read_text().split())
          source_bytes = base64.b64decode(encoded, validate=True)
          expected_sha256 = "421f89c76632aa193ad50f688c81fca94271d98dffba9d0b4445350de95bd2dd"
          actual_sha256 = hashlib.sha256(source_bytes).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"REX icon source checksum mismatch: {actual_sha256}")
          image = Image.open(BytesIO(source_bytes))
          image.load()
          image = image.convert("RGB")
          if image.size != (512, 512):
              raise SystemExit(f"Expected 512x512 REX artwork source, got {image.size}")

          public = Path("frontend/public")
          icon_dir = public / "icons"
          icon_dir.mkdir(parents=True, exist_ok=True)

          def save_png(size, path, maskable=False):
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              if maskable:
                  inset_size = round(size * 0.80)
                  artwork = resized.resize((inset_size, inset_size), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (size, size), (9, 10, 13))
                  offset = ((size - inset_size) // 2, (size - inset_size) // 2)
                  canvas.paste(artwork, offset)
                  resized = canvas
              resized.save(path, format="PNG", optimize=True)

          save_png(192, icon_dir / "rex-icon-192.png")
          save_png(512, icon_dir / "rex-icon-512.png")
          save_png(512, icon_dir / "rex-icon-maskable-512.png", maskable=True)

          for size, name in [
              (180, "apple-touch-icon.png"),
              (167, "apple-touch-icon-167.png"),
              (152, "apple-touch-icon-152.png"),
              (120, "apple-touch-icon-120.png"),
              (48, "favicon-48.png"),
              (32, "favicon-32.png"),
          ]:
              save_png(size, public / name)

          favicon = image.resize((48, 48), Image.Resampling.LANCZOS)
          favicon.save(
              public / "favicon.ico",
              format="ICO",
              sizes=[(16, 16), (32, 32), (48, 48)]
          )

          source_file.unlink()
          Path('.github/pwa-icon-source.ready').unlink(missing_ok=True)
          print("Generated REX PWA icons from the supplied artwork.")
          PY

      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public .github/pwa-icon-source.jpg.b64
          git commit -m "Add glossy REX PWA launcher icons"
          git push origin HEAD:feat/rex-pwa-icon-refresh
